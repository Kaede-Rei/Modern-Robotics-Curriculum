 <path d="M170 251 Q224 250 226 205" fill="none" stroke="#135f56" stroke-width="3"/>
 <text x="87" y="285">参考点 O</text><text x="375" y="147" fill="#135f56">r</text><text x="720" y="56" fill="#a46c21">F</text>
 <text x="333" y="292" font-size="19">τₒ = r × F</text><text x="458" y="320" font-size="13" fill="#6c7777">更换参考点会改变力矩分量，不改变实际受力</text></g></svg>