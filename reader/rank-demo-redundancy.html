  <p>改变关节 1 的角度，程序会重新计算其余两个关节，让机械臂始终抓住同一个二维目标点，虚线是前一个姿态的轮廓</p>
  <svg data-planar-3r class="rank-plot rank-large-plot" viewBox="0 0 620 320" role="img" aria-label="三连杆在相同末端位置下的不同构型">

    <path data-3r-link2 class="rank-arm-link rank-link-b" d=""/>
    <path data-3r-link3 class="rank-arm-link rank-link-c" d=""/>

    <circle data-3r-target class="rank-target-ring" r="13" cx="0" cy="0"/>
